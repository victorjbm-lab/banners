<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=320,height=480">
<meta name="viewport" content="width=320,height=480,initial-scale=1">
<title>Quiz ¿Qué arroz costeño eres? · Arroz Diana Vitamor</title>
<script type="text/javascript">
var clickTag = "https://www.google.com";
var clickTag1 = "https://www.google.com";
var clickTag2 = "https://www.google.com";
var clickTag3 = "https://www.google.com";
var clickTag4 = "https://www.google.com";
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:320px;height:480px;overflow:hidden;background:#FAF5EA;color:#1A2230;
font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ad{position:relative;width:320px;height:480px;overflow:hidden;border:1px solid #E6DCC8;background:#FAF5EA}
.brand{font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#C4421F}
.cta{display:block;width:100%;border:0;border-radius:999px;background:#E4572E;color:#14161C;font-weight:800;
font-family:inherit;text-align:center;cursor:pointer;transition:transform .15s}
.cta:active{transform:scale(.97)}
.disc{color:#5B6472;line-height:1.3}
button{font-family:inherit}

.scr{position:absolute;inset:0;padding:19.2px;display:none;flex-direction:column;justify-content:space-between;gap:10.7px;
animation:in .35s ease-out}
.scr.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(21.3px)}to{opacity:1;transform:none}}
.brand{font-size:11.7px}
.big{font-size:34.1px;font-weight:900;line-height:1.02;text-transform:uppercase}
.lead{font-size:17.1px;line-height:1.35;color:#4A5262}
.plate{align-self:center;width:128.0px;height:128.0px;border-radius:50%;
background:#E4572E;display:flex;align-items:center;justify-content:center}
.plate i{width:72%;height:72%;border-radius:50%;background:#FFFDF7;box-shadow:inset 0 0 0 10.7px #F1E6D0}
.bar{height:6.4px;background:#E6DCC8;border-radius:3.2px;overflow:hidden}
.bar b{display:block;height:100%;background:#1F7A6E;transition:width .3s}
.qn{font-size:12.8px;font-weight:700;color:#C4421F}
.q{font-size:20.3px;font-weight:800;line-height:1.15}
.opts{display:flex;flex-direction:column;gap:6.4px}
.opt{text-align:left;font-size:14.9px;padding:9.6px 14.9px;border-radius:12.8px;
border:2px solid #E6DCC8;background:#FFFFFF;color:#1A2230;cursor:pointer;font-weight:700;transition:background .15s,border-color .15s}
.opt:hover{border-color:#E4572E}
.opt.sel{background:#E4572E;border-color:#E4572E;color:#14161C}
.res-top{display:flex;flex-direction:column;gap:6.4px}
.res-kicker{font-size:14.9px;font-weight:700}
.res img{align-self:center;height:96.0px;width:auto;object-fit:contain}
.cta{font-size:16.0px;padding:13.9px}
.again{background:none;border:0;font-size:12.8px;color:#5B6472;text-decoration:underline;cursor:pointer;align-self:center}
</style>
</head>
<body>
<div class="ad">
  <section class="scr on" id="s0">
    <div class="brand">Arroz Diana Vitamor</div>
    <div class="big">¿Qué arroz costeño eres?</div>
    <div class="plate"><i></i></div>
    <div class="lead">3 preguntas rápidas y te decimos qué arroz te retrata, con su receta.</div>
    <button class="cta" id="go">¡Empezar!</button>
  </section>
  <section class="scr" id="sq">
    <div>
      <div class="bar"><b id="bar" style="width:0"></b></div>
    </div>
    <div class="qn" id="qn"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="brand">Arroz Diana Vitamor</div>
  </section>
  <section class="scr res" id="sr">
    <div class="res-top">
      <div class="brand">Tu resultado</div>
      <div class="res-kicker">Tú eres...</div>
      <div class="big" id="rn"></div>
    </div>
    <div class="lead" id="rd"></div>
    <img src="empaque.png" alt="Arroz Diana Vitamor">
    <button class="cta" id="rc">Ver la receta</button>
    <button class="again" id="again">Volver a jugar</button>
  </section>
</div>
<script>
/* ===== CONFIGURACIÓN ===== */
var C={ trackUrl:"" };  // pixel de medición con {evento} y {cb}
/* Resultados: el índice define a qué clickTag va cada receta (clickTag1..clickTag4) */
var RES=[
  {n:'Arroz con coco',d:'De las de toda la vida: tu sazón sabe a casa de la abuela y a domingo de playa.'},
  {n:'Arroz con pollo',d:'Donde tú cocinas alcanza pa\' todos. La fiesta empieza en tu olla.'},
  {n:'Arroz de camarón',d:'Te gusta lucirte: cuando cocinas, es ocasión especial.'},
  {n:'Arroz de lisa',d:'Costeña de pura cepa: sabor de mercado, tradición y orgullo.'}
];
var QS=[
  {q:'¿Tu plan ideal de domingo?',o:['Playa y pescado frito','Almuerzo con toda la familia','Cocinar algo especial','Mercado temprano y cocina de la casa']},
  {q:'En tu cocina nunca falta...',o:['Coco rallado','Una olla bien grande','Un buen sofrito','Ají y cebolla roja']},
  {q:'Cuando prueban tu arroz te dicen...',o:['¡Sabe a la abuela!','¿Hay más?','¡Qué elegancia!','¡Esto sí es de aquí!']}
];

function track(ev){
  if(!C.trackUrl) return;
  var i=new Image();
  i.src=C.trackUrl.replace('{evento}',encodeURIComponent(ev)).replace('{cb}',Date.now());
}
function exit(url,ev){
  track(ev||'clic');
  window.open(url||window.clickTag,'_blank');
}

var $=function(id){return document.getElementById(id)};
var i=0,score=[0,0,0,0],lastPick=0,winner=0;
function show(id){['s0','sq','sr'].forEach(function(x){$(x).className=$(x).className.replace(' on','')});$(id).className+=' on'}
function ask(){
  var Q=QS[i];
  $('qn').textContent='Pregunta '+(i+1)+' de '+QS.length;
  $('q').textContent=Q.q;
  $('bar').style.width=(i/QS.length*100)+'%';
  var h='';Q.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'">'+t+'</button>'});
  $('opts').innerHTML=h;
  var sq=$('sq');sq.style.animation='none';sq.offsetHeight;sq.style.animation='';
}
$('opts').addEventListener('click',function(e){
  var b=e.target.closest('.opt'); if(!b||b.disabled) return;
  var k=+b.getAttribute('data-k');
  [].forEach.call(document.querySelectorAll('.opt'),function(x){x.disabled=true});
  b.className+=' sel'; score[k]++; lastPick=k;
  setTimeout(function(){ i++; if(i<QS.length) ask(); else result(); },350);
});
function result(){
  var max=Math.max.apply(null,score);
  winner=score[lastPick]===max?lastPick:score.indexOf(max);
  $('rn').textContent=RES[winner].n;
  $('rd').textContent=RES[winner].d;
  $('bar').style.width='100%';
  show('sr'); track('quiz_completo'); track('resultado_'+(winner+1));
}
$('go').addEventListener('click',function(){track('quiz_inicio');i=0;score=[0,0,0,0];show('sq');ask()});
$('rc').addEventListener('click',function(){exit(window['clickTag'+(winner+1)]||window.clickTag,'clic_receta_'+(winner+1))});
$('again').addEventListener('click',function(){show('s0')});
</script>
</body>
</html>
